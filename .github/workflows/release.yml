# Publishes a GitHub release with the game files from dist/ attached, so GitHub counts their
# downloads.  Start it from the Actions tab (Release -> Run workflow, enter a version such as v1.0),
# or push a version tag (v1.0, v1.1, ...).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.0"
        required: true
        default: "v1.0"
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$VERSION" \
            dist/gladsheim.d64 dist/gladsheim.prg \
            dist/gladsheim-nomusic.d64 dist/gladsheim-nomusic.prg \
            --target "$GITHUB_SHA" \
            --title "Gladsheim $VERSION" \
            --notes-file docs/release-notes.md
